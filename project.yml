name: EVVMobile
options:
  bundleIdPrefix: net.fbhi
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.7"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
targets:
  EVVMobile:
    type: application
    platform: iOS
    sources:
      - EVVMobile
    configFiles:
      Debug: EVVMobile/Config/Live.xcconfig
      Release: EVVMobile/Config/Live.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fbhi.evvmobile
        INFOPLIST_FILE: EVVMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
  # STAGING app (2026-09-24): same sources, different bundle id / display name /
  # API base URL / app icon, all via Config/Staging.xcconfig. Installs side by side
  # with the live app. Xcode Cloud builds it from branch `main`; the live target is
  # built from branch `release`. NOTE: project.pbxproj is hand-maintained (this file is
  # not regenerated); there the staging target uses a folder-synchronized group over
  # EVVMobile/ so new Swift files never need registering for staging.
  EVVMobileStaging:
    type: application
    platform: iOS
    sources:
      - path: EVVMobile
        excludes:
          - "Config/*.xcconfig"
    configFiles:
      Debug: EVVMobile/Config/Staging.xcconfig
      Release: EVVMobile/Config/Staging.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fbhi.evvmobile.staging
        PRODUCT_MODULE_NAME: EVVMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconStaging
        INFOPLIST_FILE: EVVMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
  EVVMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EVVMobileUITests
    dependencies:
      - target: EVVMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fbhi.evvmobile.uitests
        TEST_TARGET_NAME: EVVMobile
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
schemes:
  EVVMobile:
    build:
      targets:
        EVVMobile: all
        EVVMobileUITests: [test]
    test:
      targets:
        - EVVMobileUITests
  EVVMobileStaging:
    build:
      targets:
        EVVMobileStaging: all
